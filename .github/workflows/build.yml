name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout the code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Organize Project Structure
      run: |
        # Create standard Android directories
        mkdir -p app/src/main/java/com/example/caribbeantents
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets

        # Move files into their correct locations if they are in the root
        [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/example/caribbeantents/
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f styles.xml ] && mv styles.xml app/src/main/res/values/
        [ -f index.html ] && mv index.html app/src/main/assets/

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
