name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout the code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Complete Android Project Structure
      run: |
        # Create standard directories
        mkdir -p app/src/main/java/com/example/caribbeantents
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets

        # Move your existing source files if present in root
        [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/example/caribbeantents/
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f styles.xml ] && mv styles.xml app/src/main/res/values/
        [ -f index.html ] && mv index.html app/src/main/assets/

        # Create root settings.gradle if missing
        if [ ! -f settings.gradle ]; then
          echo "include ':app'" > settings.gradle
        fi

        # Create root build.gradle with proper Android plugin repositories
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF

        # Create app/build.gradle if missing
        if [ ! -f app/build.gradle ]; then
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.caribbeantents'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.caribbeantents'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
        fi

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
